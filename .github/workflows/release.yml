# Builds the binaries the install scripts download.
#
# Tag a release and push it — `git tag v1.0.0 && git push origin v1.0.0` — or
# run this workflow by hand from the Actions tab. Every target is cross-compiled
# from one Linux runner, then attached to the GitHub release that the install
# scripts fetch with /releases/latest/download/<asset>.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Compile every target
        run: |
          set -eux
          mkdir -p dist
          deno compile -A --target x86_64-unknown-linux-gnu  --output dist/md2pdf-linux-x86_64   main.ts
          deno compile -A --target aarch64-unknown-linux-gnu --output dist/md2pdf-linux-aarch64  main.ts
          deno compile -A --target x86_64-apple-darwin       --output dist/md2pdf-macos-x86_64   main.ts
          deno compile -A --target aarch64-apple-darwin      --output dist/md2pdf-macos-aarch64  main.ts
          # deno appends .exe for Windows targets, giving md2pdf-windows-x86_64.exe
          deno compile -A --target x86_64-pc-windows-msvc    --output dist/md2pdf-windows-x86_64  main.ts
          deno compile -A --target aarch64-pc-windows-msvc   --output dist/md2pdf-windows-aarch64 main.ts
          ls -lh dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
